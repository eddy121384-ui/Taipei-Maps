name: Apply inventory prototype v0.1

on:
  push:
    branches:
      - feat/school-district-inventory-prototype-v01
    paths:
      - 'public/inventory-prototype-v01.js'
      - 'public/data/inventory/school-district-inventory-prototype-v01.json'
      - 'tools/research/apply_inventory_prototype_v01.mjs'
      - '.github/workflows/apply-inventory-prototype-v01.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic desktop bridge
        run: node tools/research/apply_inventory_prototype_v01.mjs
      - name: Commit bridge if changed
        run: |
          if git diff --quiet; then
            echo "Desktop bridge already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maplibre-pmtiles-provider-spike.html
          git commit -m "chore: wire school inventory prototype into desktop map"
          git push
