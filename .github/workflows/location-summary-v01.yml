name: Location Summary v0.1

on:
  pull_request:
    paths:
      - 'public/buju-location-summary-v01.mjs'
      - 'public/buju-school-district-resolver-v01.mjs'
      - 'public/location-summary-v01.html'
      - 'tools/dev/test_buju_location_summary_v01.mjs'
      - 'tools/dev/test_buju_school_district_resolver_v01.mjs'
      - 'tools/data/validate_location_summary_sources_v01.mjs'
      - 'docs/data/location_summary_v01.md'
      - '.github/workflows/location-summary-v01.yml'
  push:
    branches:
      - feat/location-summary-v01
    paths:
      - 'public/buju-location-summary-v01.mjs'
      - 'public/buju-school-district-resolver-v01.mjs'
      - 'public/location-summary-v01.html'
      - 'tools/dev/test_buju_location_summary_v01.mjs'
      - 'tools/dev/test_buju_school_district_resolver_v01.mjs'
      - 'tools/data/validate_location_summary_sources_v01.mjs'
      - 'docs/data/location_summary_v01.md'
      - '.github/workflows/location-summary-v01.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Location Summary synthetic regression
        run: node tools/dev/test_buju_location_summary_v01.mjs
      - name: School point-resolver regression
        run: node tools/dev/test_buju_school_district_resolver_v01.mjs
      - name: Accepted Place Metrics baseline regression
        run: node tools/data/validate_place_metrics_v01.mjs
      - name: Taipei school assignment dataset regression
        run: node tools/data/validate_taipei_school_districts.mjs
