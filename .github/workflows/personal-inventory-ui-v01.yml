name: Personal inventory UI v0.1

on:
  push:
    branches:
      - research/personal-inventory-v01
    paths:
      - 'public/data/inventory/personal-research-current-v01.json'
      - 'tools/research/apply_personal_inventory_ui_v01.mjs'
      - '.github/workflows/personal-inventory-ui-v01.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply personal inventory UI bridge
        run: node tools/research/apply_personal_inventory_ui_v01.mjs
      - name: Run inventory filter regression
        run: node tools/dev/test_inventory_filters_v01.mjs
      - name: Run school inventory regression
        run: node tools/dev/test_school_inventory_prototype_v01.mjs
      - name: Commit UI bridge if changed
        run: |
          if git diff --quiet -- public/inventory-prototype-v01.js public/mobile-school-inventory-v04.html; then
            echo "UI bridge already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/inventory-prototype-v01.js public/mobile-school-inventory-v04.html
          git commit -m "feat: show personal research inventory in desktop and mobile"
          git push
