name: School inventory prototype v0.1

on:
  pull_request:
    paths:
      - 'public/maplibre-pmtiles-provider-spike.html'
      - 'public/inventory-prototype-v01.js'
      - 'public/data/inventory/school-district-inventory-prototype-v01.json'
      - 'tools/dev/test_school_inventory_prototype_v01.mjs'
      - '.github/workflows/school-inventory-prototype-v01.yml'
  push:
    branches:
      - feat/school-district-inventory-prototype-v01
    paths:
      - 'public/maplibre-pmtiles-provider-spike.html'
      - 'public/inventory-prototype-v01.js'
      - 'public/data/inventory/school-district-inventory-prototype-v01.json'
      - 'tools/dev/test_school_inventory_prototype_v01.mjs'
      - '.github/workflows/school-inventory-prototype-v01.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory UX semantic regression
        run: node tools/dev/test_school_inventory_prototype_v01.mjs
      - name: Existing Location Summary regression
        run: node tools/dev/test_location_summary_desktop_integration_v01.mjs
