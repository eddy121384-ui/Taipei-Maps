name: Taipei citywide canonical POI v0.1

on:
  push:
    branches:
      - feat/taipei-citywide-canonical-poi-v01
    paths:
      - 'public/buju-poi-canonical-v02.mjs'
      - 'tools/data/build_taipei_daily_life_poi_v01.mjs'
      - 'tools/data/extract_overture_places_bbox.py'
      - 'tools/data/taipei_daily_life_poi_v01_config.json'
      - 'tools/dev/test_buju_poi_canonical_v02.mjs'
      - '.github/workflows/taipei-citywide-canonical-poi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(data): refresh Taipei citywide canonical POI v0.1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '1787097600'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/taipei-citywide-canonical-poi-v01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DuckDB
        run: python -m pip install 'duckdb>=1.1,<2'

      - name: Canonical v0.2 regression
        run: node tools/dev/test_buju_poi_canonical_v02.mjs

      - name: Build citywide dataset first pass
        run: node tools/data/build_taipei_daily_life_poi_v01.mjs

      - name: Record first-pass checksums
        run: sha256sum public/data/daily-life-poi/taipei-*-v01.* > /tmp/poi-first.sha256

      - name: Build citywide dataset second pass
        run: node tools/data/build_taipei_daily_life_poi_v01.mjs --skip-extract

      - name: Verify byte determinism
        run: sha256sum -c /tmp/poi-first.sha256

      - name: Validate generated JSON
        run: |
          node -e "for (const f of ['public/data/daily-life-poi/taipei-canonical-v01.geojson','public/data/daily-life-poi/taipei-unresolved-v01.geojson','public/data/daily-life-poi/taipei-poi-manifest-v01.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('PASS generated JSON')"

      - name: Commit generated citywide data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/daily-life-poi/taipei-canonical-v01.geojson public/data/daily-life-poi/taipei-unresolved-v01.geojson public/data/daily-life-poi/taipei-poi-manifest-v01.json
          if git diff --cached --quiet; then
            echo 'Generated data unchanged.'
            exit 0
          fi
          git commit -m 'chore(data): refresh Taipei citywide canonical POI v0.1'
          git push origin HEAD:feat/taipei-citywide-canonical-poi-v01
