name: Taipei OSM POI reconciliation v0.1

on:
  push:
    branches:
      - feat/taipei-osm-poi-reconciliation-v01
    paths:
      - 'public/buju-poi-canonical-v02.mjs'
      - 'public/buju-poi-reconcile-v01.mjs'
      - 'tools/data/build_taipei_osm_poi_reconciliation_v01.mjs'
      - 'tools/data/taipei_osm_poi_reconciliation_v01_config.json'
      - 'tools/data/taipei_daily_life_poi_v01_config.json'
      - 'tools/dev/test_buju_poi_canonical_v02.mjs'
      - 'tools/dev/test_buju_poi_reconcile_v01.mjs'
      - '.github/workflows/taipei-osm-poi-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DATE_EPOCH: '1787183999'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/taipei-osm-poi-reconciliation-v01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Canonical v0.2 regression
        run: node tools/dev/test_buju_poi_canonical_v02.mjs

      - name: OSM reconciliation regression
        run: node tools/dev/test_buju_poi_reconcile_v01.mjs

      - name: Build reconciled dataset first pass
        run: node tools/data/build_taipei_osm_poi_reconciliation_v01.mjs

      - name: Normalize deterministic manifest metadata
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='public/data/daily-life-poi/taipei-poi-reconciled-manifest-v01.json';
          const raw='.cache/osm-poi-reconciliation-v01/taipei-osm-overpass-v01.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.overpass_endpoint_last_fetch='historical-overpass';
          j.osm_overpass_raw_sha256=crypto.createHash('sha256').update(fs.readFileSync(raw)).digest('hex');
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

      - name: Record first-pass checksums
        run: |
          sha256sum \
            public/data/daily-life-poi/taipei-osm-target-v01.geojson \
            public/data/daily-life-poi/taipei-osm-canonical-v01.geojson \
            public/data/daily-life-poi/taipei-osm-reconciliation-v01.json \
            public/data/daily-life-poi/taipei-canonical-reconciled-v01.geojson \
            public/data/daily-life-poi/taipei-poi-reconciled-manifest-v01.json \
            > /tmp/osm-poi-first.sha256

      - name: Build reconciled dataset second pass
        run: node tools/data/build_taipei_osm_poi_reconciliation_v01.mjs --skip-fetch

      - name: Normalize second-pass manifest metadata
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p='public/data/daily-life-poi/taipei-poi-reconciled-manifest-v01.json';
          const raw='.cache/osm-poi-reconciliation-v01/taipei-osm-overpass-v01.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.overpass_endpoint_last_fetch='historical-overpass';
          j.osm_overpass_raw_sha256=crypto.createHash('sha256').update(fs.readFileSync(raw)).digest('hex');
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

      - name: Verify byte determinism
        run: sha256sum -c /tmp/osm-poi-first.sha256

      - name: Validate generated JSON
        run: |
          node -e "for (const f of ['public/data/daily-life-poi/taipei-osm-target-v01.geojson','public/data/daily-life-poi/taipei-osm-canonical-v01.geojson','public/data/daily-life-poi/taipei-osm-reconciliation-v01.json','public/data/daily-life-poi/taipei-canonical-reconciled-v01.geojson','public/data/daily-life-poi/taipei-poi-reconciled-manifest-v01.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('PASS generated reconciliation JSON')"

      - name: Commit generated reconciled data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/data/daily-life-poi/taipei-osm-target-v01.geojson \
            public/data/daily-life-poi/taipei-osm-canonical-v01.geojson \
            public/data/daily-life-poi/taipei-osm-reconciliation-v01.json \
            public/data/daily-life-poi/taipei-canonical-reconciled-v01.geojson \
            public/data/daily-life-poi/taipei-poi-reconciled-manifest-v01.json
          if git diff --cached --quiet; then
            echo 'Generated reconciled data unchanged.'
            exit 0
          fi
          git commit -m 'chore(data): refresh Taipei OSM reconciled POI v0.1'
          git push origin HEAD:feat/taipei-osm-poi-reconciliation-v01
