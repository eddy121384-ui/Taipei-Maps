<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>卜居 · duplicate review v0.11 loader</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,"Noto Sans TC",sans-serif;background:#eef1f4;color:#263238}
    .boot{padding:24px}.err{white-space:pre-wrap;color:#b42318;background:#fff;border:1px solid #efb4ae;border-radius:12px;padding:14px;max-width:900px}
  </style>
</head>
<body>
<div class="boot" id="boot">Loading duplicate review v0.11…</div>
<script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const res=await fetch('/daily-life-poi-overture-spike-v09.html',{cache:'no-store'});
    if(!res.ok)throw new Error(`failed to load v0.9 source: HTTP ${res.status}`);
    let html=await res.text();

    const brokenFilter="labelSearch=['downcase',['concat',['coalesce',['get','@name'],''],' ',['to-string',['coalesce',['get','brand'],'']]],contains=";
    const fixedFilter="labelSearch=['downcase',['concat',['coalesce',['get','@name'],''],' ',['to-string',['coalesce',['get','brand'],'']]]],contains=";
    if(!html.includes(brokenFilter))throw new Error('expected v0.9 labelSearch signature not found; refusing blind patch');
    html=html.replace(brokenFilter,fixedFilter);

    const brokenGuard="if(identities.size!==1||![...identities][0]===identity)";
    const fixedGuard="if(identities.size!==1||[...identities][0]!==identity)";
    if(!html.includes(brokenGuard))throw new Error('expected v0.9 mixed-identity guard signature not found; refusing blind patch');
    html=html.replace(brokenGuard,fixedGuard);
    html=html.replaceAll('v0.9','v0.11');

    const openTag='<script>';
    const closeTag='</scr'+'ipt>';
    const start=html.lastIndexOf(openTag);
    const end=html.lastIndexOf(closeTag);
    if(start<0||end<=start)throw new Error('inline script not found after patch');
    const inline=html.slice(start+openTag.length,end);
    try{new Function(inline);}catch(err){throw new Error(`patched inline JS still fails syntax check: ${err.message}`);}

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    boot.className='boot err';
    boot.textContent='Duplicate review v0.11 bootstrap failed:\n'+(err?.stack||err);
  }
})();
</script>
</body>
</html>
