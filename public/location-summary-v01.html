<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>卜居 · Location Summary Card v0.1</title>
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="/taipei-school-districts-115.js"></script>
<style>
html,body,#map{height:100%;margin:0}body{font-family:Inter,system-ui,"Noto Sans TC",sans-serif;color:#18232c}.panel{position:absolute;z-index:2;left:12px;top:12px;width:min(410px,calc(100vw - 48px));max-height:calc(100vh - 48px);overflow:auto;background:rgba(255,255,255,.97);padding:14px 16px;border-radius:14px;box-shadow:0 5px 22px #0002}.panel h1{font-size:16px;margin:0 0 4px}.muted{font-size:11.5px;color:#677680;line-height:1.45}.status{font-size:11.5px;margin:8px 0 10px}.section{border-top:1px solid #e3e8eb;padding-top:9px;margin-top:9px}.section-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6b7983;margin-bottom:5px}.row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:start;padding:4px 0}.label{font-size:11.5px;color:#6b7983}.value{font-size:13px;font-weight:700;line-height:1.35}.detail{font-size:10.5px;color:#7b8992;font-weight:400;margin-top:1px}.school-note{font-size:10.5px;color:#8a671d;background:#fff7e3;padding:6px 8px;border-radius:8px;margin-top:5px;display:none}.query{margin-top:10px;padding-top:8px;border-top:1px solid #e3e8eb;font-size:10.5px;color:#7b8992}.maplibregl-canvas{cursor:crosshair}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:10.5px;color:#697780}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}.mrt{background:#218c74}.hospital{background:#c62828}.clinic{background:#00838f}.query-dot{background:#17212b}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Location Summary Card v0.1</h1>
  <div class="muted">點台北市任意位置。距離皆為 geographic / great-circle distance，不是步行時間。</div>
  <div id="status" class="status">Preparing accepted location datasets…</div>

  <div class="section">
    <div class="section-title">生活 DAILY LIFE</div>
    <div class="row"><div class="label">便利商店</div><div class="value" id="conv">—</div></div>
    <div class="row"><div class="label">超市</div><div class="value" id="supermarket">—</div></div>
  </div>

  <div class="section">
    <div class="section-title">交通 TRANSIT</div>
    <div class="row"><div class="label">最近捷運</div><div class="value" id="mrt">—</div></div>
  </div>

  <div class="section">
    <div class="section-title">醫療 HEALTHCARE</div>
    <div class="row"><div class="label">最近醫院</div><div class="value" id="hospital">—</div></div>
    <div class="row"><div class="label">最近診所</div><div class="value" id="clinic">—</div></div>
  </div>

  <div class="section">
    <div class="section-title">學區 SCHOOL</div>
    <div class="row"><div class="label">國小</div><div class="value" id="elementary">—</div></div>
    <div class="row"><div class="label">國中</div><div class="value" id="junior">—</div></div>
    <div id="school-note" class="school-note"></div>
  </div>

  <div class="legend"><span><i class="dot query-dot"></i>查詢點</span><span><i class="dot mrt"></i>捷運</span><span><i class="dot hospital"></i>醫院</span><span><i class="dot clinic"></i>診所</span></div>
  <div id="query" class="query">尚未選擇位置</div>
</div>

<script type="module">
import { computeLocationSummary } from './buju-location-summary-v01.mjs';
import { resolveTaipeiSchoolDistricts } from './buju-school-district-resolver-v01.mjs';

const $=id=>document.getElementById(id);
const statusEl=$('status'),queryEl=$('query'),schoolNoteEl=$('school-note');
const districtLoads=new Map();
let requestSerial=0;

function distanceText(record){return record?`${Math.round(record.distance_m)} m`:'—';}
function placeText(record){
  if(!record)return '—';
  const extra=record.address||record.location||record.district||'';
  return `${record.name} · ${distanceText(record)}${extra?`<div class="detail">${escapeHtml(extra)}</div>`:''}`;
}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function setHtml(id,html){$(id).innerHTML=html;}

async function ensureDistrictLoaded(district){
  const dataset=window.TaipeiMapsSchoolDistrictData115;
  const prefix=`${district}|`;
  const alreadyLoaded=Object.keys(dataset?.levels?.elementary||{}).some(key=>key.startsWith(prefix))
    ||Object.keys(dataset?.levels?.junior||{}).some(key=>key.startsWith(prefix));
  if(alreadyLoaded)return;
  if(districtLoads.has(district))return districtLoads.get(district);
  const promise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src=`/school-districts-115/${encodeURIComponent(district)}.js`;
    script.async=true;
    script.onload=()=>resolve();
    script.onerror=()=>reject(new Error(`school assignment shard failed: ${district}`));
    document.head.appendChild(script);
  });
  districtLoads.set(district,promise);
  try{await promise;}catch(error){districtLoads.delete(district);throw error;}
}

function schoolResolver(point){
  return resolveTaipeiSchoolDistricts(point,{
    dataset:window.TaipeiMapsSchoolDistrictData115,
    ensureDistrictLoaded,
  });
}

function contextFeatures(summary){
  const features=[];
  const [lon,lat]=[summary.query.lon,summary.query.lat];
  features.push({type:'Feature',geometry:{type:'Point',coordinates:[lon,lat]},properties:{kind:'query',label:'查詢點'}});
  const add=(record,kind,label)=>{
    if(!record?.coordinates)return;
    features.push({type:'Feature',geometry:{type:'Point',coordinates:record.coordinates},properties:{kind,label:`${label} · ${record.name}`}});
    features.push({type:'Feature',geometry:{type:'LineString',coordinates:[[lon,lat],record.coordinates]},properties:{kind}});
  };
  add(summary.transit.nearest_mrt_station,'mrt','捷運');
  add(summary.healthcare.nearest_hospital,'hospital','醫院');
  add(summary.healthcare.nearest_clinic,'clinic','診所');
  return {type:'FeatureCollection',features};
}

function render(summary){
  const d=summary.daily_life;
  setHtml('conv',`${distanceText(d.nearest_convenience_store)}<div class="detail">500m 內 ${d.convenience_store_count_500m} 家 · ${escapeHtml(d.nearest_convenience_store?.name||'')}</div>`);
  setHtml('supermarket',`${distanceText(d.nearest_supermarket)}<div class="detail">800m 內 ${d.supermarket_count_800m} 家 · ${escapeHtml(d.nearest_supermarket?.name||'')}</div>`);
  setHtml('mrt',placeText(summary.transit.nearest_mrt_station));
  setHtml('hospital',placeText(summary.healthcare.nearest_hospital));
  setHtml('clinic',placeText(summary.healthcare.nearest_clinic));

  const school=summary.school||{};
  $('elementary').textContent=school.elementary_school_district||'—';
  $('junior').textContent=school.junior_school_district||'—';
  if(school.status==='resolved'){
    schoolNoteEl.style.display='block';
    schoolNoteEl.textContent=`115學年度 · ${school.district}區 ${school.village}里 第${(school.neighbors||[]).join('、')}鄰 · 官方里鄰學區`;
  }else{
    schoolNoteEl.style.display='block';
    schoolNoteEl.textContent=`學區 ${school.status||'unavailable'}：${school.reason||'官方資料無法解析'}`;
  }
  queryEl.textContent=`查詢點：${summary.query.lon.toFixed(6)}, ${summary.query.lat.toFixed(6)} · schema ${summary.schema_version}`;
}

try{
  const [poiResponse,mrtResponse,healthResponse]=await Promise.all([
    fetch('/data/daily-life-poi/taipei-canonical-reconciled-v01.geojson',{cache:'no-store'}),
    fetch('/generated/taipei_mrt_stations_official.geojson',{cache:'no-store'}),
    fetch('/generated/taipei_healthcare_facilities.geojson',{cache:'no-store'}),
  ]);
  if(!poiResponse.ok||!mrtResponse.ok||!healthResponse.ok)throw new Error(`source HTTP ${poiResponse.status}/${mrtResponse.status}/${healthResponse.status}`);
  const [poi,mrt,healthcare]=await Promise.all([poiResponse.json(),mrtResponse.json(),healthResponse.json()]);
  statusEl.textContent=`READY · POI ${poi.features.length} · MRT ${mrt.features.length} · healthcare ${healthcare.features.length}`;

  const map=new maplibregl.Map({container:'map',center:[121.545,25.055],zoom:11.7,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});
  map.addControl(new maplibregl.NavigationControl(),'top-right');

  map.on('load',()=>{
    map.addSource('summary-context',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    map.addLayer({id:'summary-lines',type:'line',source:'summary-context',filter:['==',['geometry-type'],'LineString'],paint:{'line-color':['match',['get','kind'],'mrt','#218c74','hospital','#c62828','clinic','#00838f','#53636e'],'line-width':1.5,'line-opacity':.55,'line-dasharray':[2,2]}});
    map.addLayer({id:'summary-points',type:'circle',source:'summary-context',filter:['==',['geometry-type'],'Point'],paint:{'circle-radius':['match',['get','kind'],'query',6,5],'circle-color':['match',['get','kind'],'mrt','#218c74','hospital','#c62828','clinic','#00838f','#17212b'],'circle-stroke-color':'#fff','circle-stroke-width':1.6}});
    map.addLayer({id:'summary-labels',type:'symbol',source:'summary-context',minzoom:12,filter:['==',['geometry-type'],'Point'],layout:{'text-field':['get','label'],'text-size':11,'text-offset':[0,1.15],'text-anchor':'top','text-allow-overlap':false},paint:{'text-color':'#263238','text-halo-color':'rgba(255,255,255,.96)','text-halo-width':1.25}});

    map.on('click',async event=>{
      const serial=++requestSerial;
      const point={lon:event.lngLat.lng,lat:event.lngLat.lat};
      statusEl.textContent='Computing summary · querying official school neighbor geometry…';
      schoolNoteEl.style.display='block';schoolNoteEl.textContent='學區查詢中…';
      try{
        const summary=await computeLocationSummary(point,{
          poiFeatures:poi.features,
          mrtStationFeatures:mrt.features,
          healthcareFeatures:healthcare.features,
          resolveSchoolDistricts:schoolResolver,
        });
        if(serial!==requestSerial)return;
        render(summary);
        map.getSource('summary-context').setData(contextFeatures(summary));
        statusEl.textContent='READY · complete location summary';
      }catch(error){
        if(serial!==requestSerial)return;
        statusEl.textContent=`ERROR · ${error.message}`;statusEl.style.color='#b42318';
      }
    });
  });
}catch(error){
  statusEl.textContent=`ERROR · ${error.message} · run start-location-summary-v01-smoke.bat`;
  statusEl.style.color='#b42318';
}
</script>
</body></html>
