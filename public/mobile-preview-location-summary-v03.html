<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#9fd5f6" />
  <title>卜居 · Mobile Preview + Location Summary</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
  <style>
    :root{--hud-h:174px}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overflow:hidden;background:#9fd5f6;color:#24303a}#map{position:absolute;inset:0}
    .hud{position:absolute;z-index:8;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:10px;border:1px solid rgba(255,255,255,.65);border-radius:16px;background:rgba(255,255,255,.92);box-shadow:0 8px 28px rgba(0,0,0,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    .title{font-size:13px;font-weight:800;margin-bottom:8px}.controls{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.controls+.controls{margin-top:7px}.controls::-webkit-scrollbar{display:none}button{flex:0 0 auto;border:1px solid #c7d0d8;border-radius:12px;padding:9px 11px;background:#fff;font-size:13px;font-weight:800;color:#26323c;min-height:42px}.active{background:#26323c;color:#fff;border-color:#26323c}.mode-active{background:#edf3f7;border-color:#96a7b4}.disabled{opacity:.45}.status{margin-top:8px;font-size:11px;line-height:1.35;color:#5e6872}.status+.status{margin-top:3px}.good{color:#137333;font-weight:700}.error{color:#b42318;font-weight:700}.muted{color:#68727d}
    .summarySheet{position:absolute;z-index:7;left:12px;right:12px;bottom:calc(var(--hud-h) + 22px + env(safe-area-inset-bottom));max-height:min(43vh,430px);overflow:auto;border:1px solid rgba(255,255,255,.75);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 10px 30px rgba(0,0,0,.20);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:9px 12px 12px;transform:translateY(16px);opacity:0;pointer-events:none;transition:.18s ease}
    .summarySheet.open{transform:translateY(0);opacity:1;pointer-events:auto}.summaryHandle{width:40px;height:4px;border-radius:999px;background:#cbd3d8;margin:0 auto 7px}.summaryHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.summaryTitle{font-size:14px;font-weight:850}.summaryCoords{font-size:10px;color:#7a8790;margin-top:2px}.summaryClose{border:0;background:#edf1f3;border-radius:999px;width:30px;height:30px;min-height:30px;padding:0;font-size:18px}.summarySection{border-top:1px solid #e6ebee;margin-top:8px;padding-top:7px}.summarySection:first-of-type{border-top:0}.summaryLabel{font-size:10px;letter-spacing:.08em;color:#73818b;font-weight:850;margin-bottom:2px}.summaryRow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12.5px}.summaryKey{color:#65737d;white-space:nowrap}.summaryValue{text-align:right;font-weight:750}.summaryMeta{font-size:10px;color:#7a8790;margin-top:3px}.summaryHint{position:absolute;z-index:6;left:50%;bottom:calc(var(--hud-h) + 28px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(36,48,58,.88);color:white;font-size:10.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}.summaryHint.on{opacity:1}.maplibregl-ctrl-top-right{top:env(safe-area-inset-top)}
    @media(min-width:760px){.hud{left:14px;right:auto;width:430px}.summarySheet{left:456px;right:auto;bottom:14px;width:390px;max-height:76vh}.summaryHint{left:670px;bottom:28px}}
  </style>
</head>
<body>
<div id="map"></div>
<section id="summarySheet" class="summarySheet" aria-live="polite">
  <div class="summaryHandle"></div>
  <div class="summaryHead"><div><div class="summaryTitle">這裡住起來怎麼樣？</div><div id="summaryCoords" class="summaryCoords">—</div></div><button id="summaryClose" class="summaryClose" aria-label="關閉摘要">×</button></div>
  <div class="summarySection"><div class="summaryLabel">生活 DAILY LIFE</div><div class="summaryRow"><span class="summaryKey">便利商店</span><span id="sumConv" class="summaryValue">—</span></div><div class="summaryRow"><span class="summaryKey">超市</span><span id="sumSuper" class="summaryValue">—</span></div></div>
  <div class="summarySection"><div class="summaryLabel">交通 TRANSIT</div><div class="summaryRow"><span class="summaryKey">最近捷運</span><span id="sumMrt" class="summaryValue">—</span></div></div>
  <div class="summarySection"><div class="summaryLabel">醫療 HEALTHCARE</div><div class="summaryRow"><span class="summaryKey">最近醫院</span><span id="sumHospital" class="summaryValue">—</span></div><div class="summaryRow"><span class="summaryKey">最近診所</span><span id="sumClinic" class="summaryValue">—</span></div></div>
  <div class="summarySection"><div class="summaryLabel">學區 SCHOOL · 115</div><div class="summaryRow"><span class="summaryKey">國小</span><span id="sumElementary" class="summaryValue">—</span></div><div class="summaryRow"><span class="summaryKey">國中</span><span id="sumJunior" class="summaryValue">—</span></div><div id="sumSchoolMeta" class="summaryMeta"></div></div>
  <div class="summarySection"><div class="summaryMeta">距離為 geographic / great-circle distance，不是步行距離。學區依官方里鄰界，不以最近學校推測。</div></div>
</section>
<div id="summaryHint" class="summaryHint">摘要模式 ON · 點地圖任意位置</div>
<section id="hud" class="hud">
  <div class="title">Taipei-Maps · 手機預覽</div>
  <div class="controls">
    <button id="mapBtn" class="active">🗺 地圖</button><button id="photoBtn">🛰 航照</button><button id="threeBtn" class="active">🏙 3D</button><button id="terrainBtn" class="active">⛰ 地形</button><button id="summaryBtn">📍 摘要</button>
    <button class="place" data-place="daan">大安</button><button class="place" data-place="xinyi">信義</button><button class="place" data-place="banqiao">板橋</button><button class="place" data-place="yangmingshan">陽明山</button><button class="place" data-place="tokyo">東京</button>
  </div>
  <div class="controls"><button id="districtBtn">🎓 學區 OFF</button><button id="elementaryBtn" class="mode-active">國小</button><button id="juniorBtn">國中</button><button id="seniorBtn" class="disabled" disabled>高中</button><button id="schoolPointBtn" class="mode-active">🏫 校點 ON</button></div>
  <div id="status" class="status">Loading shared map core…</div><div id="districtStatus" class="status muted">學區 OFF · 這版畫的是學區區塊，不是以距離猜測。</div><div id="schoolPointStatus" class="status muted">校點待學區開啟 · 只顯示目前選擇的國小或國中</div><div id="summaryStatus" class="status muted">摘要資料載入中…</div>
</section>
<script type="module">
const SNAPSHOT='172fbb1d78d788df4f626cca28debf648a9c240d';
const BASE=`https://cdn.jsdelivr.net/gh/eddy121384-ui/Taipei-Maps@${SNAPSHOT}/public/`;
const DISTRICTS=['松山','信義','大安','中山','中正','大同','萬華','文山','南港','內湖','士林','北投'];
const $=s=>document.querySelector(s);const hud=$('#hud'),summarySheet=$('#summarySheet'),summaryHint=$('#summaryHint'),summaryBtn=$('#summaryBtn'),summaryStatus=$('#summaryStatus');
function updateHudHeight(){document.documentElement.style.setProperty('--hud-h',`${Math.ceil(hud.getBoundingClientRect().height)}px`)}window.addEventListener('resize',updateHudHeight);new ResizeObserver(updateHudHeight).observe(hud);updateHudHeight();
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error(`script load failed: ${src}`));document.head.appendChild(s)})}
await Promise.all([loadScript(`${BASE}shared-map-core.js`),loadScript(`${BASE}taipei-school-districts-115.js`)]);for(const d of DISTRICTS)await loadScript(`${BASE}school-districts-115/${encodeURIComponent(d)}.js`);await Promise.all([loadScript(`${BASE}school-district-data-guard.js`),loadScript(`${BASE}school-district-layer.js`),loadScript(`${BASE}school-location-layer.js`)]);
const [{computeLocationSummary},{resolveTaipeiSchoolDistricts},poiRes,mrtRes,healthRes]=await Promise.all([import(`${BASE}buju-location-summary-v01.mjs`),import(`${BASE}buju-school-district-resolver-v01.mjs`),fetch(`${BASE}data/daily-life-poi/taipei-canonical-reconciled-v01.geojson`),fetch(`${BASE}data/location-summary-v01/taipei-mrt-stations.geojson`),fetch(`${BASE}data/location-summary-v01/taipei-healthcare-facilities.geojson`)]);
if(!poiRes.ok||!mrtRes.ok||!healthRes.ok)throw new Error(`summary static data HTTP ${poiRes.status}/${mrtRes.status}/${healthRes.status}`);const [poi,mrt,health]=await Promise.all([poiRes.json(),mrtRes.json(),healthRes.json()]);
const dataset=window.TaipeiMapsSchoolDistrictData115;const summarySources={poiFeatures:poi.features,mrtStationFeatures:mrt.features,healthcareFeatures:health.features,resolveSchoolDistricts:p=>resolveTaipeiSchoolDistricts(p,{dataset})};summaryStatus.textContent=`摘要 READY · POI ${poi.features.length} · MRT ${mrt.features.length} · 醫療 ${health.features.length}`;summaryStatus.className='status good';
if(!window.maplibregl||!window.pmtiles||!window.TaipeiMapsCore||!window.TaipeiMapsSchoolDistrictDataReady||!dataset||!window.TaipeiMapsSchoolDistrictLayer||!window.TaipeiMapsSchoolLocationLayer)throw new Error('Map core / school runtime missing');
const core=window.TaipeiMapsCore,status=$('#status'),districtStatus=$('#districtStatus'),schoolPointStatus=$('#schoolPointStatus');let overture;try{overture=await core.preflightOverture()}catch(e){status.textContent=`Overture 建築資料載入失敗：${e?.message||e}`;status.className='status error';throw e}
const map=core.createMap({container:'map',view:{...core.PLACES.daan,zoom:15,pitch:57},overtureUrl:overture.candidate.url,hasParts:overture.hasParts});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
let photo=false,show3d=true,terrain=true,districtOn=false,districtLevel='elementary',schoolPointsOn=true,summaryMode=false,summaryMarker=null,districtLayer=null,schoolLocationLayer=null;
const mapBtn=$('#mapBtn'),photoBtn=$('#photoBtn'),threeBtn=$('#threeBtn'),terrainBtn=$('#terrainBtn'),districtBtn=$('#districtBtn'),elementaryBtn=$('#elementaryBtn'),juniorBtn=$('#juniorBtn'),schoolPointBtn=$('#schoolPointBtn');
function sync(){if(!map.isStyleLoaded())return;const provider=core.applyCoreVisualState(map,{photo,show3d,terrain,hasParts:overture.hasParts});mapBtn.classList.toggle('active',!photo);photoBtn.classList.toggle('active',photo);threeBtn.classList.toggle('active',show3d);terrainBtn.classList.toggle('active',terrain);const basemap=photo?(provider?.label||'官方航照無覆蓋 · OSM fallback'):'OSM 地圖';status.textContent=`READY · ${basemap} · ${show3d?'3D':'2D'} · ${terrain?'地形 ON':'地形 OFF'} · Overture ${overture.candidate.release}`;status.className='status good'}
function syncDistrictButtons(){districtBtn.classList.toggle('active',districtOn);districtBtn.textContent=`🎓 學區 ${districtOn?'ON':'OFF'}`;elementaryBtn.classList.toggle('mode-active',districtLevel==='elementary');juniorBtn.classList.toggle('mode-active',districtLevel==='junior');schoolPointBtn.classList.toggle('mode-active',schoolPointsOn);schoolPointBtn.textContent=`🏫 校點 ${schoolPointsOn?'ON':'OFF'}`}
function syncSchoolLocationLayer(){if(!schoolLocationLayer)return;schoolLocationLayer.setLevel(districtLevel);schoolLocationLayer.setEnabled(districtOn&&schoolPointsOn);if(!districtOn)schoolPointStatus.textContent='校點待學區開啟 · 只顯示目前選擇的國小或國中'}
function setSummaryMode(on){summaryMode=on;summaryBtn.classList.toggle('active',on);summaryBtn.textContent=on?'📍 摘要 ON':'📍 摘要';summaryHint.classList.toggle('on',on&&!summarySheet.classList.contains('open'));if(!on){summarySheet.classList.remove('open');summaryHint.classList.remove('on');if(summaryMarker){summaryMarker.remove();summaryMarker=null}}}
$('#summaryClose').onclick=()=>{summarySheet.classList.remove('open');summaryHint.classList.toggle('on',summaryMode)};summaryBtn.onclick=()=>setSummaryMode(!summaryMode);
const meter=v=>Number.isFinite(Number(v))?`${Math.round(Number(v))}m`:'—';
async function inspectSummary(lng,lat){summarySheet.classList.add('open');summaryHint.classList.remove('on');$('#summaryCoords').textContent=`${lng.toFixed(6)}, ${lat.toFixed(6)}`;for(const id of ['#sumConv','#sumSuper','#sumMrt','#sumHospital','#sumClinic','#sumElementary','#sumJunior'])$(id).textContent='計算中…';$('#sumSchoolMeta').textContent='';if(!summaryMarker)summaryMarker=new maplibregl.Marker({color:'#202b33'}).setLngLat([lng,lat]).addTo(map);else summaryMarker.setLngLat([lng,lat]);const r=await computeLocationSummary({lon:lng,lat},summarySources),d=r.daily_life,t=r.transit.nearest_mrt_station,h=r.healthcare,s=r.school;$('#sumConv').textContent=`${meter(d.nearest_convenience_store?.distance_m)} · 500m內 ${d.convenience_store_count_500m}家`;$('#sumSuper').textContent=`${meter(d.nearest_supermarket?.distance_m)} · 800m內 ${d.supermarket_count_800m}家`;$('#sumMrt').textContent=t?`${t.name} · ${meter(t.distance_m)}`:'—';$('#sumHospital').textContent=h.nearest_hospital?`${h.nearest_hospital.name} · ${meter(h.nearest_hospital.distance_m)}`:'—';$('#sumClinic').textContent=h.nearest_clinic?`${h.nearest_clinic.name} · ${meter(h.nearest_clinic.distance_m)}`:'—';$('#sumElementary').textContent=s.elementary_school_district||'查無';$('#sumJunior').textContent=s.junior_school_district||'查無';$('#sumSchoolMeta').textContent=s.status==='resolved'?`${s.district}區 · ${s.village}里 · 第${s.neighbors.join('、')}鄰`:`學區 ${s.status} · ${s.reason||''}`}
map.on('load',()=>{sync();districtLayer=new TaipeiMapsSchoolDistrictLayer.SchoolDistrictLayer(map,{onState:({state,message})=>{districtStatus.textContent=message;districtStatus.className=`status ${state==='error'?'error':state==='ready'?'good':'muted'}`}});districtLayer.init();schoolLocationLayer=new TaipeiMapsSchoolLocationLayer.SchoolLocationLayer(map,{onState:({state,message})=>{schoolPointStatus.textContent=message;schoolPointStatus.className=`status ${state==='error'?'error':state==='ready'?'good':'muted'}`}});schoolLocationLayer.init();syncDistrictButtons()});
map.on('click',e=>{if(!summaryMode)return;inspectSummary(e.lngLat.lng,e.lngLat.lat).catch(err=>{summaryStatus.textContent=`摘要查詢失敗：${err.message}`;summaryStatus.className='status error'})});map.on('moveend',()=>{if(photo)sync()});map.on('taipei-maps-imagerychange',()=>{if(photo)sync()});map.on('error',e=>console.error('Map error',e?.error||e));
mapBtn.onclick=()=>{photo=false;sync()};photoBtn.onclick=()=>{photo=true;sync()};threeBtn.onclick=()=>{show3d=!show3d;sync()};terrainBtn.onclick=()=>{terrain=!terrain;core.setTerrain(map,terrain);sync()};districtBtn.onclick=()=>{if(!districtLayer)return;districtOn=!districtOn;districtLayer.setEnabled(districtOn);syncSchoolLocationLayer();syncDistrictButtons()};elementaryBtn.onclick=()=>{if(!districtLayer)return;districtLevel='elementary';districtLayer.setLevel('elementary');syncSchoolLocationLayer();syncDistrictButtons()};juniorBtn.onclick=()=>{if(!districtLayer)return;districtLevel='junior';districtLayer.setLevel('junior');syncSchoolLocationLayer();syncDistrictButtons()};schoolPointBtn.onclick=()=>{schoolPointsOn=!schoolPointsOn;syncSchoolLocationLayer();syncDistrictButtons()};document.querySelectorAll('.place').forEach(btn=>btn.onclick=()=>map.easeTo({...core.PLACES[btn.dataset.place],duration:650}));
</script>
</body>
</html>
