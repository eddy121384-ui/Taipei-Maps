<style>
:root{--hud:122px}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#24303a;background:#9fd5f6}#map{position:absolute;inset:0}.maplibregl-ctrl-top-right{top:calc(env(safe-area-inset-top) + 38px)}

.sheet{position:absolute;z-index:9;left:10px;right:10px;bottom:calc(var(--hud) + 18px + env(safe-area-inset-bottom));max-height:min(59vh,560px);overflow:auto;padding:8px 11px 12px;border:1px solid rgba(255,255,255,.78);border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 12px 34px rgba(0,0,0,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transform:translateY(16px);opacity:0;pointer-events:none;transition:.17s ease}.sheet.open{transform:translateY(0);opacity:1;pointer-events:auto}.handle{width:38px;height:4px;border-radius:999px;background:#cbd3d8;margin:0 auto 7px}.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.kicker{font-size:9px;letter-spacing:.08em;color:#74818a;font-weight:850}.sheetTitle{font-size:15px;font-weight:900;margin-top:1px}.close{width:30px;height:30px;min-height:30px;border:0;border-radius:999px;background:#edf1f3;padding:0;font-size:18px}
.filters{margin:8px 0;border:1px solid #e0e6e9;border-radius:12px;background:#fafbfc}.filters summary{list-style:none;padding:8px 9px;font-size:10.5px;font-weight:850;cursor:pointer}.filters summary::-webkit-details-marker{display:none}.filterGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 9px 9px}.filter{display:grid;gap:3px;font-size:9px;color:#6c7881;font-weight:800}.filter select{width:100%;min-width:0;border:1px solid #cbd4da;border-radius:9px;background:#fff;padding:7px 6px;font-size:11px;color:#26323c}.filterActions{grid-column:1/-1;display:flex;justify-content:flex-end}.reset{min-height:0;padding:5px 8px;font-size:10px}
.stat{margin:8px 0;padding:8px 9px;border-radius:11px;background:#f3f6f7;font-size:11px;line-height:1.4}.stat strong{font-size:18px}.debug{display:flex;align-items:center;gap:5px;font-size:10px;color:#697680;margin:7px 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:9.5px;color:#6c7881;margin-bottom:7px}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:3px}.exact{background:#147a4b}.shared{background:#bd7a05}.pending{background:#75818a}.mismatch{background:#b42318}.list{display:grid;gap:7px}.card{border:1px solid #dfe5e8;border-radius:12px;padding:8px 9px;background:#fff}.card.mismatch{border-style:dashed}.card.pending{border-style:dotted}.row{display:flex;justify-content:space-between;gap:8px}.name,.price{font-size:12px;font-weight:850}.price{white-space:nowrap}.sub{font-size:9.7px;line-height:1.42;color:#71808a;margin-top:2px}.badge{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:850}.badge.exact{background:#e7f6ee;color:#146c43}.badge.shared{background:#fff3d6;color:#8a5a00}.badge.pending{background:#eef1f3;color:#56626b}.badge.mismatch{background:#fdebea;color:#a5271d}.detail{border-top:1px solid #e6eaed;margin-top:8px;padding-top:8px}.grid{display:grid;grid-template-columns:80px 1fr;gap:4px 7px;font-size:10.5px}.grid span:nth-child(odd){color:#697680}.grid span:nth-child(even){text-align:right;font-weight:750}.warn,.share,.pendingNote{margin-top:7px;padding:7px 8px;border-radius:9px;font-size:9.8px;line-height:1.4}.warn{background:#fff1ef;color:#9a271d}.share{background:#fff6df;color:#7b570b}.pendingNote{background:#f0f3f5;color:#56626b}.source{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:850;color:#245b8f;text-decoration:none}.empty{padding:12px 8px;color:#67747d;font-size:11px;line-height:1.5}.disclaimer{margin-top:9px;font-size:9px;line-height:1.4;color:#7b8790}.invMarker{border:0;border-radius:999px;padding:5px 7px;color:#fff;font:850 10px/1 system-ui;box-shadow:0 3px 10px rgba(0,0,0,.28);white-space:nowrap}.invMarker.exact{background:#147a4b}.invMarker.shared{background:#bd7a05}.invMarker.mismatch{background:#b42318}
@media(min-width:760px){.hud{left:14px;right:auto;width:430px}.sheet{left:456px;right:auto;bottom:14px;width:410px;max-height:80vh}.topHint{left:680px}}
</style>
</head>
<body>
<div id="map"></div><div id="topHint" class="topHint">🎓 點國中學區，再用條件縮小房源</div>
<section id="sheet" class="sheet" aria-live="polite"><div class="handle"></div><div class="sheetHead"><div><div class="kicker">#71 · INVENTORY FILTERS v0.1</div><div id="sheetTitle" class="sheetTitle">學區現在有什麼房子？</div></div><button id="close" class="close">×</button></div><details id="filters" class="filters"><summary id="filterSummary">🔎 篩選 · 未套用</summary><div class="filterGrid"><label class="filter">總價上限<select id="filterPrice"><option value="">不限</option><option value="3000">3,000萬</option><option value="4000">4,000萬</option><option value="5000">5,000萬</option><option value="8000">8,000萬</option></select></label><label class="filter">坪數<select id="filterPing"><option value="any">不限</option><option value="lt20">20坪以下</option><option value="20_40">20–40坪</option><option value="40_60">40–60坪</option><option value="gte60">60坪以上</option></select></label><label class="filter">屋齡<select id="filterAge"><option value="">不限</option><option value="20">20年以上</option><option value="30">30年以上</option><option value="40">40年以上</option></select></label><label class="filter">型態<select id="filterForm"><option value="any">不限</option><option value="walkup">公寓</option><option value="elevator">電梯</option></select></label><label class="filter">房數<select id="filterBedrooms"><option value="">不限</option><option value="1">1房以上</option><option value="2">2房以上</option><option value="3">3房以上</option><option value="4">4房以上</option></select></label><div class="filterActions"><button id="resetFilters" class="reset">清除</button></div></div></details><div id="stat" class="stat"></div><label class="debug"><input id="debug" type="checkbox"/> 顯示 mismatch 研究案例</label><div class="legend"><span><i class="dot exact"></i>精確</span><span><i class="dot shared"></i>共同</span><span><i class="dot pending"></i>待定位</span><span><i class="dot mismatch"></i>不符</span></div><div id="list" class="list"></div><div class="disclaimer">Research fixture，不代表完整即時市場。待定位候選因地址不足不畫 pin，也不計入官方學區已驗證戶數。</div></section>
<section id="hud" class="hud"><div class="hudTitle"><span>卜居 · 學區房源</span><small>mobile v04 + filters</small></div><div class="controls"><button id="mapBtn" class="active">🗺 地圖</button><button id="photoBtn">🛰 航照</button><button id="threeBtn">🏙 3D</button><button id="terrainBtn">⛰ 地形</button><button id="inventoryBtn" class="active">🏠 房源</button></div><div class="controls"><button id="districtBtn" class="active">🎓 學區 ON</button><button id="juniorBtn" class="mode">國中</button><button id="schoolPointBtn">🏫 校點</button><button class="place" data-place="daan">大安</button><button class="place" data-place="xinyi">信義</button></div><div id="status" class="status">Loading…</div><div id="schoolStatus" class="status">國中學區準備中…</div></section>
<script type="module">
const SNAPSHOT='4d249fd2c944f8907abb82031b121feef462f0a8';
const BASE=`https://cdn.jsdelivr.net/gh/eddy121384-ui/Taipei-Maps@${SNAPSHOT}/public/`;const DISTRICTS=['松山','信義','大安','中山','中正','大同','萬華','文山','南港','內湖','士林','北投'];const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hud=$('#hud');function syncHud(){document.documentElement.style.setProperty('--hud',`${Math.ceil(hud.getBoundingClientRect().height)}px`)}new ResizeObserver(syncHud).observe(hud);window.addEventListener('resize',syncHud);syncHud();function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(new Error(`load failed ${src}`));document.head.appendChild(s)})}
await Promise.all([loadScript(`${BASE}shared-map-core.js`),loadScript(`${BASE}taipei-school-districts-115.js`)]);for(const d of DISTRICTS)await loadScript(`${BASE}school-districts-115/${encodeURIComponent(d)}.js`);await Promise.all([loadScript(`${BASE}school-district-data-guard.js`),loadScript(`${BASE}school-district-layer.js`),loadScript(`${BASE}school-location-layer.js`)]);const [filterCore,fixtureRes]=await Promise.all([import(`${BASE}inventory-filter-core-v01.mjs`),fetch(`${BASE}data/inventory/school-district-inventory-prototype-v01.json`)]);if(!fixtureRes.ok)throw new Error(`inventory fixture HTTP ${fixtureRes.status}`);const homes=(await fixtureRes.json()).homes||[];const {DEFAULT_INVENTORY_FILTERS,normalizeInventoryFilters,summarizeInventory}=filterCore;if(!window.TaipeiMapsCore||!window.TaipeiMapsSchoolDistrictDataReady||!window.TaipeiMapsSchoolDistrictLayer)throw new Error('school runtime missing');const core=window.TaipeiMapsCore,status=$('#status'),schoolStatus=$('#schoolStatus'),overture=await core.preflightOverture();const map=core.createMap({container:'map',view:{...core.PLACES.daan,zoom:14.5,pitch:0,bearing:0},overtureUrl:overture.candidate.url,hasParts:overture.hasParts});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');let photo=false,show3d=false,terrain=false,districtOn=true,pointsOn=false,districtLayer=null,schoolLocationLayer=null,inventoryOn=true,selectedSchool=null,assignmentLabel='',selectedId=null,filters={...DEFAULT_INVENTORY_FILTERS};const markers=new Map();const mapBtn=$('#mapBtn'),photoBtn=$('#photoBtn'),threeBtn=$('#threeBtn'),terrainBtn=$('#terrainBtn'),districtBtn=$('#districtBtn'),schoolPointBtn=$('#schoolPointBtn'),inventoryBtn=$('#inventoryBtn'),sheet=$('#sheet'),list=$('#list'),stat=$('#stat'),debug=$('#debug');const controls={price:$('#filterPrice'),ping:$('#filterPing'),age:$('#filterAge'),form:$('#filterForm'),bedrooms:$('#filterBedrooms')};function readFilters(){filters=normalizeInventoryFilters({price_max_wan:controls.price.value,ping_band:controls.ping.value,age_min_years:controls.age.value,building_form:controls.form.value,bedrooms_min:controls.bedrooms.value});return filters}function summary(){return summarizeInventory(homes,{school:selectedSchool,filters,showMismatch:debug.checked,includeLocationCandidates:true})}function finiteCoord(h){return h?.lon!==null&&h?.lat!==null&&Number.isFinite(Number(h.lon))&&Number.isFinite(Number(h.lat))}function syncVisual(){if(!map.isStyleLoaded())return;const provider=core.applyCoreVisualState(map,{photo,show3d,terrain,hasParts:overture.hasParts});mapBtn.classList.toggle('active',!photo);photoBtn.classList.toggle('active',photo);threeBtn.classList.toggle('active',show3d);terrainBtn.classList.toggle('active',terrain);districtBtn.classList.toggle('active',districtOn);districtBtn.textContent=`🎓 學區 ${districtOn?'ON':'OFF'}`;schoolPointBtn.classList.toggle('active',pointsOn);inventoryBtn.classList.toggle('active',inventoryOn);status.textContent=`READY · ${photo?(provider?.label||'航照'):'OSM'} · ${show3d?'3D':'2D'} · ${terrain?'地形 ON':'地形 OFF'}`;status.className='status good'}function cls(s){return s==='verified_exact'?'exact':s==='verified_shared'?'shared':s==='insufficient_location'?'pending':'mismatch'}function txt(s){return s==='verified_exact'?'官方精確學區':s==='verified_shared'?'官方共同學區':s==='insufficient_location'?'待定位驗證':'學區標示不符'}function clearMarkers(){for(const m of markers.values())m.remove();markers.clear()}function renderDetail(h){const old=$('#detail');if(old)old.remove();const d=document.createElement('div');d.id='detail';d.className='detail';d.innerHTML=`<div class="row"><div><div class="name">${esc(h.name)}</div><div class="sub">${esc(h.street)} · ${finiteCoord(h)?'地圖位置可用':'公開地址不足，暫不上 pin'}</div></div><div class="price">${esc(h.asking_label)}</div></div><span class="badge ${cls(h.verification_status)}">${txt(h.verification_status)}</span><div class="grid"><span>單價</span><span>${esc(h.unit_price_label||'—')}</span><span>坪數</span><span>${h.total_ping?`${h.total_ping} 坪`:'—'}</span><span>屋齡／型態</span><span>${h.age_years?`${h.age_years}年 · `:''}${esc(h.building_type_label||'—')}</span><span>格局／樓層</span><span>${esc([h.layout,h.floor].filter(Boolean).join(' · ')||'—')}</span><span>官方國中</span><span>${esc(h.official_junior||'待定位')}</span></div>${h.verification_status==='mismatch'?`<div class="warn">⚠ ${esc(h.note)}</div>`:h.verification_status==='verified_shared'?`<div class="share">◐ ${esc(h.note)}</div>`:h.verification_status==='insufficient_location'?`<div class="pendingNote">○ ${esc(h.note)}</div>`:''}<a class="source" target="_blank" rel="noopener" href="${esc(h.source_url)}">開啟來源 · ${esc(h.source_label)} ↗</a>`;stat.insertAdjacentElement('afterend',d)}function focusHome(h){selectedId=h.id;if(finiteCoord(h))map.easeTo({center:[h.lon,h.lat],zoom:16,duration:450});renderDetail(h)}function renderMarkers(){clearMarkers();for(const h of summary().visible){if(!finiteCoord(h)||h.verification_status==='insufficient_location')continue;const el=document.createElement('button');el.className=`invMarker ${cls(h.verification_status)}`;el.textContent=h.asking_wan?`${Math.round(h.asking_wan).toLocaleString()}萬`:h.asking_label;el.onclick=e=>{e.stopPropagation();focusHome(h)};markers.set(h.id,new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([h.lon,h.lat]).addTo(map))}}function render(){readFilters();const old=$('#detail');if(old)old.remove();selectedId=null;const s=summary();$('#filterSummary').textContent=s.active_filters?`🔎 篩選 · ${s.active_filters} 個條件`:'🔎 篩選 · 未套用';if(!selectedSchool){clearMarkers();$('#sheetTitle').textContent=assignmentLabel||'這個國中學區';stat.innerHTML='<strong>0</strong> 戶 prototype 房源';list.innerHTML=`<div class="empty">${esc(assignmentLabel||'此學區')}目前研究 fixture 尚未覆蓋。這不代表市場上沒有房子。</div>`;schoolStatus.textContent=`${assignmentLabel||'此學區'} · 尚無 fixture`;return}$('#sheetTitle').textContent=`${selectedSchool}國中 · 房源`;stat.innerHTML=`<strong>${s.total}</strong> 戶符合 · 已驗證 ${s.verified} · 待定位 ${s.pending_location}${s.mismatch?`<br><span style="color:#7a8790">含 ${s.mismatch} 戶 mismatch 研究案例</span>`:''}`;list.innerHTML='';if(!s.total)list.innerHTML='<div class="empty">目前 research fixture 沒有符合這組條件的房源。這不代表市場上真的沒有。</div>';for(const h of s.visible){const c=document.createElement('div');c.className=`card ${cls(h.verification_status)}`;const meta=[h.total_ping?`${h.total_ping}坪`:null,h.age_years?`${h.age_years}年`:null,h.building_type_label,h.bedrooms?`${h.bedrooms}房`:null].filter(Boolean).join(' · ');c.innerHTML=`<div class="row"><div><div class="name">${esc(h.name)}</div><div class="sub">${esc(h.street)}${meta?` · ${esc(meta)}`:''}</div></div><div class="price">${esc(h.asking_label)}</div></div><span class="badge ${cls(h.verification_status)}">${txt(h.verification_status)}</span><div class="sub">${h.verification_status==='insufficient_location'?'位置不足，尚未做官方里鄰驗證':`官方國中：${esc(h.official_junior)}`}</div>`;c.onclick=()=>focusHome(h);list.appendChild(c)}renderMarkers();schoolStatus.textContent=`${selectedSchool}國中 · 篩選後 ${s.total} 戶 · 已驗證 ${s.verified}`;schoolStatus.className='status good'}function selectAssignment(raw){assignmentLabel=String(raw||'').trim();selectedSchool=assignmentLabel.includes('金華')?'金華':assignmentLabel.includes('中正')?'中正':null;if(!inventoryOn)return;sheet.classList.add('open');render();const pts=summary().visible.filter(finiteCoord).map(h=>[h.lon,h.lat]);if(pts.length){const b=pts.reduce((x,p)=>x.extend(p),new maplibregl.LngLatBounds(pts[0],pts[0]));map.fitBounds(b,{padding:{top:80,bottom:Math.max(280,Math.round(innerHeight*.46)),left:45,right:45},maxZoom:15.5,duration:500})}}map.on('load',()=>{core.setTerrain(map,false);syncVisual();districtLayer=new window.TaipeiMapsSchoolDistrictLayer.SchoolDistrictLayer(map,{onState:({state,message})=>{schoolStatus.textContent=message;schoolStatus.className=`status ${state==='error'?'error':state==='ready'?'good':''}`}});districtLayer.init();districtLayer.setLevel('junior');districtLayer.setEnabled(true);schoolLocationLayer=new window.TaipeiMapsSchoolLocationLayer.SchoolLocationLayer(map);schoolLocationLayer.init();schoolLocationLayer.setLevel('junior');schoolLocationLayer.setEnabled(false);map.on('click','school-catchment-fill',e=>{const p=e.features?.[0]?.properties||{};if(p.level!=='junior')return;setTimeout(()=>document.querySelectorAll('.maplibregl-popup').forEach(x=>x.remove()),0);selectAssignment(p.school)});schoolStatus.textContent='國中學區 READY · 點色塊看房源';schoolStatus.className='status good'});mapBtn.onclick=()=>{photo=false;syncVisual()};photoBtn.onclick=()=>{photo=true;syncVisual()};threeBtn.onclick=()=>{show3d=!show3d;syncVisual()};terrainBtn.onclick=()=>{terrain=!terrain;core.setTerrain(map,terrain);syncVisual()};districtBtn.onclick=()=>{districtOn=!districtOn;districtLayer?.setEnabled(districtOn);schoolLocationLayer?.setEnabled(districtOn&&pointsOn);syncVisual()};schoolPointBtn.onclick=()=>{pointsOn=!pointsOn;schoolLocationLayer?.setEnabled(districtOn&&pointsOn);syncVisual()};inventoryBtn.onclick=()=>{inventoryOn=!inventoryOn;if(!inventoryOn){sheet.classList.remove('open');clearMarkers()}else if(assignmentLabel){sheet.classList.add('open');render()}syncVisual()};for(const e of Object.values(controls))e.onchange=render;$('#resetFilters').onclick=()=>{controls.price.value='';controls.ping.value='any';controls.age.value='';controls.form.value='any';controls.bedrooms.value='';render()};debug.onchange=render;$('#close').onclick=()=>sheet.classList.remove('open');document.querySelectorAll('.place').forEach(b=>b.onclick=()=>map.easeTo({...core.PLACES[b.dataset.place],duration:500}));
</script>
