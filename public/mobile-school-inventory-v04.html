<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#9fd5f6" />
<title>卜居 · 學區房源 Mobile v04</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js"></script>
<style>
:root{--hud:122px}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#24303a;background:#9fd5f6}#map{position:absolute;inset:0}.maplibregl-ctrl-top-right{top:calc(env(safe-area-inset-top) + 38px)}
.topHint{position:absolute;z-index:8;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(36,48,58,.90);color:#fff;font-size:11px;font-weight:750;white-space:nowrap;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.hud{position:absolute;z-index:10;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:9px;border-radius:17px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.93);box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.hudTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:850;margin-bottom:7px}.hudTitle small{font-size:9.5px;color:#74818a;font-weight:650}.controls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.controls+.controls{margin-top:6px}.controls::-webkit-scrollbar{display:none}button{flex:0 0 auto;border:1px solid #c8d1d8;border-radius:11px;background:#fff;color:#26323c;padding:8px 10px;min-height:38px;font-size:12px;font-weight:800}.active{background:#26323c;color:white;border-color:#26323c}.mode{background:#eef3f6;border-color:#a4b3be}.status{margin-top:6px;font-size:9.5px;line-height:1.3;color:#66727b}.good{color:#137333;font-weight:750}.error{color:#b42318;font-weight:750}
.sheet{position:absolute;z-index:9;left:10px;right:10px;bottom:calc(var(--hud) + 18px + env(safe-area-inset-bottom));max-height:min(49vh,470px);overflow:auto;padding:8px 11px 12px;border:1px solid rgba(255,255,255,.78);border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 12px 34px rgba(0,0,0,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transform:translateY(16px);opacity:0;pointer-events:none;transition:.17s ease}.sheet.open{transform:translateY(0);opacity:1;pointer-events:auto}.handle{width:38px;height:4px;border-radius:999px;background:#cbd3d8;margin:0 auto 7px}.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.kicker{font-size:9px;letter-spacing:.08em;color:#74818a;font-weight:850}.sheetTitle{font-size:15px;font-weight:900;margin-top:1px}.close{width:30px;height:30px;min-height:30px;border:0;border-radius:999px;background:#edf1f3;padding:0;font-size:18px}.stat{margin:8px 0;padding:8px 9px;border-radius:11px;background:#f3f6f7;font-size:11px;line-height:1.4}.stat strong{font-size:18px}.debug{display:flex;align-items:center;gap:5px;font-size:10px;color:#697680;margin:7px 0}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:9.5px;color:#6c7881;margin-bottom:7px}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:3px}.exact{background:#147a4b}.shared{background:#bd7a05}.mismatch{background:#b42318}.list{display:grid;gap:7px}.card{border:1px solid #dfe5e8;border-radius:12px;padding:8px 9px;background:#fff}.card.mismatch{border-style:dashed}.row{display:flex;justify-content:space-between;gap:8px}.name,.price{font-size:12px;font-weight:850}.price{white-space:nowrap}.sub{font-size:9.7px;line-height:1.42;color:#71808a;margin-top:2px}.badge{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:850}.badge.exact{background:#e7f6ee;color:#146c43}.badge.shared{background:#fff3d6;color:#8a5a00}.badge.mismatch{background:#fdebea;color:#a5271d}.detail{border-top:1px solid #e6eaed;margin-top:8px;padding-top:8px}.grid{display:grid;grid-template-columns:80px 1fr;gap:4px 7px;font-size:10.5px}.grid span:nth-child(odd){color:#697680}.grid span:nth-child(even){text-align:right;font-weight:750}.warn{margin-top:7px;padding:7px 8px;border-radius:9px;background:#fff1ef;color:#9a271d;font-size:9.8px;line-height:1.4}.share{margin-top:7px;padding:7px 8px;border-radius:9px;background:#fff6df;color:#7b570b;font-size:9.8px;line-height:1.4}.source{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:850;color:#245b8f;text-decoration:none}.empty{padding:12px 8px;color:#67747d;font-size:11px;line-height:1.5}.disclaimer{margin-top:9px;font-size:9px;line-height:1.4;color:#7b8790}.invMarker{border:0;border-radius:999px;padding:5px 7px;color:#fff;font:850 10px/1 system-ui;box-shadow:0 3px 10px rgba(0,0,0,.28);white-space:nowrap}.invMarker.exact{background:#147a4b}.invMarker.shared{background:#bd7a05}.invMarker.mismatch{background:#b42318}
@media(min-width:760px){.hud{left:14px;right:auto;width:430px}.sheet{left:456px;right:auto;bottom:14px;width:390px;max-height:80vh}.topHint{left:670px}}
</style>
</head>
<body>
<div id="map"></div><div id="topHint" class="topHint">🎓 點國中學區，看目前房源</div>
<section id="sheet" class="sheet" aria-live="polite"><div class="handle"></div><div class="sheetHead"><div><div class="kicker">#71 · MOBILE PRODUCT PROTOTYPE</div><div id="sheetTitle" class="sheetTitle">學區現在有什麼房子？</div></div><button id="close" class="close">×</button></div><div id="stat" class="stat"></div><label class="debug"><input id="debug" type="checkbox"/> 顯示學區 mismatch 研究案例</label><div class="legend"><span><i class="dot exact"></i>精確</span><span><i class="dot shared"></i>共同學區</span><span><i class="dot mismatch"></i>不符</span></div><div id="list" class="list"></div><div class="disclaimer">研究 fixture，不代表完整即時市場。正式產品應由授權 live inventory provider 提供房源；115 學年度官方里鄰學區驗證保留。</div></section>
<section id="hud" class="hud"><div class="hudTitle"><span>卜居 · 學區房源</span><small>mobile v04</small></div><div class="controls"><button id="mapBtn" class="active">🗺 地圖</button><button id="photoBtn">🛰 航照</button><button id="threeBtn">🏙 3D</button><button id="terrainBtn">⛰ 地形</button><button id="inventoryBtn" class="active">🏠 房源</button></div><div class="controls"><button id="districtBtn" class="active">🎓 學區 ON</button><button id="juniorBtn" class="mode">國中</button><button id="schoolPointBtn">🏫 校點</button><button class="place" data-place="daan">大安</button><button class="place" data-place="xinyi">信義</button></div><div id="status" class="status">Loading…</div><div id="schoolStatus" class="status">國中學區準備中…</div></section>
<script type="module">
const SNAPSHOT='5b58e319b0d7468a248a8194901d33253a03d480';
const BASE=`https://cdn.jsdelivr.net/gh/eddy121384-ui/Taipei-Maps@${SNAPSHOT}/public/`;
const DISTRICTS=['松山','信義','大安','中山','中正','大同','萬華','文山','南港','內湖','士林','北投'];
const VERIFIED=new Set(['verified_exact','verified_shared']);const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hud=$('#hud');function syncHud(){document.documentElement.style.setProperty('--hud',`${Math.ceil(hud.getBoundingClientRect().height)}px`)}new ResizeObserver(syncHud).observe(hud);window.addEventListener('resize',syncHud);syncHud();
function loadScript(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(new Error(`load failed ${src}`));document.head.appendChild(s)})}
await Promise.all([loadScript(`${BASE}shared-map-core.js`),loadScript(`${BASE}taipei-school-districts-115.js`)]);for(const d of DISTRICTS)await loadScript(`${BASE}school-districts-115/${encodeURIComponent(d)}.js`);await Promise.all([loadScript(`${BASE}school-district-data-guard.js`),loadScript(`${BASE}school-district-layer.js`),loadScript(`${BASE}school-location-layer.js`)]);
const fixtureRes=await fetch(`${BASE}data/inventory/school-district-inventory-prototype-v01.json`);if(!fixtureRes.ok)throw new Error(`inventory fixture HTTP ${fixtureRes.status}`);const fixture=await fixtureRes.json(),homes=fixture.homes||[];
if(!window.TaipeiMapsCore||!window.TaipeiMapsSchoolDistrictDataReady||!window.TaipeiMapsSchoolDistrictLayer)throw new Error('school runtime missing');
const core=window.TaipeiMapsCore,status=$('#status'),schoolStatus=$('#schoolStatus');const overture=await core.preflightOverture();const map=core.createMap({container:'map',view:{...core.PLACES.daan,zoom:14.5,pitch:0,bearing:0},overtureUrl:overture.candidate.url,hasParts:overture.hasParts});map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
let photo=false,show3d=false,terrain=false,districtOn=true,pointsOn=false,districtLayer=null,schoolLocationLayer=null,inventoryOn=true,selectedSchool=null,assignmentLabel='',selectedId=null;const markers=new Map();
const mapBtn=$('#mapBtn'),photoBtn=$('#photoBtn'),threeBtn=$('#threeBtn'),terrainBtn=$('#terrainBtn'),districtBtn=$('#districtBtn'),schoolPointBtn=$('#schoolPointBtn'),inventoryBtn=$('#inventoryBtn'),sheet=$('#sheet'),list=$('#list'),stat=$('#stat'),debug=$('#debug');
function syncVisual(){if(!map.isStyleLoaded())return;const provider=core.applyCoreVisualState(map,{photo,show3d,terrain,hasParts:overture.hasParts});mapBtn.classList.toggle('active',!photo);photoBtn.classList.toggle('active',photo);threeBtn.classList.toggle('active',show3d);terrainBtn.classList.toggle('active',terrain);districtBtn.classList.toggle('active',districtOn);districtBtn.textContent=`🎓 學區 ${districtOn?'ON':'OFF'}`;schoolPointBtn.classList.toggle('active',pointsOn);inventoryBtn.classList.toggle('active',inventoryOn);status.textContent=`READY · ${photo?(provider?.label||'航照'):'OSM'} · ${show3d?'3D':'2D'} · ${terrain?'地形 ON':'地形 OFF'} · Overture ${overture.candidate.release}`;status.className='status good'}
function classFor(s){return s==='verified_exact'?'exact':s==='verified_shared'?'shared':'mismatch'}function textFor(s){return s==='verified_exact'?'官方精確學區':s==='verified_shared'?'官方共同學區':'學區標示不符'}
function visibleHomes(){if(!selectedSchool)return[];return homes.filter(h=>h.query_school===selectedSchool&&(VERIFIED.has(h.verification_status)||debug.checked))}function verifiedHomes(){if(!selectedSchool)return[];return homes.filter(h=>h.query_school===selectedSchool&&VERIFIED.has(h.verification_status))}
function clearMarkers(){for(const m of markers.values())m.remove();markers.clear()}
function focusHome(h){selectedId=h.id;map.easeTo({center:[h.lon,h.lat],zoom:16,duration:450});renderDetail(h)}
function renderDetail(h){const old=$('#detail');if(old)old.remove();const d=document.createElement('div');d.id='detail';d.className='detail';d.innerHTML=`<div class="row"><div><div class="name">${esc(h.name)}</div><div class="sub">${esc(h.street)} · 位置 ${esc(h.location_precision_grade)}</div></div><div class="price">${esc(h.asking_label)}</div></div><span class="badge ${classFor(h.verification_status)}">${textFor(h.verification_status)}</span><div class="grid"><span>單價</span><span>${esc(h.unit_price_label||'—')}</span><span>坪數</span><span>${h.total_ping?`${esc(h.total_ping)} 坪`:'—'}</span><span>格局／樓層</span><span>${esc([h.layout,h.floor].filter(Boolean).join(' · ')||'—')}</span><span>外部宣稱</span><span>${esc(h.external_school_claim)}</span><span>官方國小</span><span>${esc(h.official_elementary)}</span><span>官方國中</span><span>${esc(h.official_junior)}</span><span>官方里鄰</span><span>${esc(h.official_location)}</span></div>${h.verification_status==='mismatch'?`<div class="warn">⚠ ${esc(h.note)}</div>`:h.verification_status==='verified_shared'?`<div class="share">◐ ${esc(h.note)}</div>`:''}<a class="source" target="_blank" rel="noopener" href="${esc(h.source_url)}">開啟來源 · ${esc(h.source_label)} ↗</a>`;stat.insertAdjacentElement('afterend',d)}
function renderMarkers(){clearMarkers();for(const h of visibleHomes()){const el=document.createElement('button');el.className=`invMarker ${classFor(h.verification_status)}`;el.textContent=h.asking_wan?`${Math.round(h.asking_wan).toLocaleString()}萬`:h.asking_label.replace(' 萬區間','');el.onclick=e=>{e.stopPropagation();focusHome(h)};markers.set(h.id,new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([h.lon,h.lat]).addTo(map))}}
function render(){const old=$('#detail');if(old)old.remove();selectedId=null;const verified=verifiedHomes();if(!selectedSchool){clearMarkers();$('#sheetTitle').textContent=assignmentLabel||'這個國中學區';stat.innerHTML=`<strong>0</strong> 戶 prototype 房源`;list.innerHTML=`<div class="empty">${esc(assignmentLabel||'此學區')}目前研究 fixture 尚未覆蓋。這不代表市場上沒有房子。</div>`;schoolStatus.textContent=`${assignmentLabel||'此學區'} · 尚無 fixture`;return}$('#sheetTitle').textContent=`${selectedSchool}國中 · 房源`;const exact=verified.filter(h=>h.verification_status==='verified_exact').length,shared=verified.filter(h=>h.verification_status==='verified_shared').length,mismatch=homes.filter(h=>h.query_school===selectedSchool&&h.verification_status==='mismatch').length;stat.innerHTML=`<strong>${verified.length}</strong> 戶已驗證 · 精確 ${exact} · 共同 ${shared}${mismatch?`<br><span style="color:#7a8790">另有 ${mismatch} 戶 mismatch（預設排除）</span>`:''}`;list.innerHTML='';for(const h of visibleHomes()){const c=document.createElement('div');c.className=`card ${classFor(h.verification_status)}`;c.innerHTML=`<div class="row"><div><div class="name">${esc(h.name)}</div><div class="sub">${esc(h.street)}${h.total_ping?` · ${esc(h.total_ping)}坪`:''}</div></div><div class="price">${esc(h.asking_label)}</div></div><span class="badge ${classFor(h.verification_status)}">${textFor(h.verification_status)}</span><div class="sub">官方國中：${esc(h.official_junior)}</div>`;c.onclick=()=>focusHome(h);list.appendChild(c)}renderMarkers();schoolStatus.textContent=`${selectedSchool}國中 · 已驗證 ${verified.length} 戶 · research fixture`;schoolStatus.className='status good'}
function selectAssignment(raw){assignmentLabel=String(raw||'').trim();selectedSchool=assignmentLabel.includes('金華')?'金華':assignmentLabel.includes('中正')?'中正':null;if(!inventoryOn)return;sheet.classList.add('open');render();const pts=verifiedHomes().map(h=>[h.lon,h.lat]);if(pts.length){const b=pts.reduce((x,p)=>x.extend(p),new maplibregl.LngLatBounds(pts[0],pts[0]));map.fitBounds(b,{padding:{top:80,bottom:Math.max(250,Math.round(innerHeight*.42)),left:45,right:45},maxZoom:15.5,duration:500})}}
map.on('load',()=>{core.setTerrain(map,false);syncVisual();districtLayer=new window.TaipeiMapsSchoolDistrictLayer.SchoolDistrictLayer(map,{onState:({state,message})=>{schoolStatus.textContent=message;schoolStatus.className=`status ${state==='error'?'error':state==='ready'?'good':''}`}});districtLayer.init();districtLayer.setLevel('junior');districtLayer.setEnabled(true);schoolLocationLayer=new window.TaipeiMapsSchoolLocationLayer.SchoolLocationLayer(map);schoolLocationLayer.init();schoolLocationLayer.setLevel('junior');schoolLocationLayer.setEnabled(false);map.on('click','school-catchment-fill',e=>{const p=e.features?.[0]?.properties||{};if(p.level!=='junior')return;setTimeout(()=>document.querySelectorAll('.maplibregl-popup').forEach(x=>x.remove()),0);selectAssignment(p.school)});schoolStatus.textContent='國中學區 READY · 點任一色塊看房源';schoolStatus.className='status good'});
map.on('moveend',()=>{if(photo)syncVisual()});map.on('taipei-maps-imagerychange',()=>{if(photo)syncVisual()});
mapBtn.onclick=()=>{photo=false;syncVisual()};photoBtn.onclick=()=>{photo=true;syncVisual()};threeBtn.onclick=()=>{show3d=!show3d;syncVisual()};terrainBtn.onclick=()=>{terrain=!terrain;core.setTerrain(map,terrain);syncVisual()};districtBtn.onclick=()=>{districtOn=!districtOn;districtLayer?.setEnabled(districtOn);schoolLocationLayer?.setEnabled(districtOn&&pointsOn);syncVisual()};schoolPointBtn.onclick=()=>{pointsOn=!pointsOn;schoolLocationLayer?.setEnabled(districtOn&&pointsOn);syncVisual()};inventoryBtn.onclick=()=>{inventoryOn=!inventoryOn;if(!inventoryOn){sheet.classList.remove('open');clearMarkers()}else if(assignmentLabel){sheet.classList.add('open');render()}syncVisual()};debug.onchange=render;$('#close').onclick=()=>sheet.classList.remove('open');document.querySelectorAll('.place').forEach(b=>b.onclick=()=>map.easeTo({...core.PLACES[b.dataset.place],duration:500}));
</script>
</body>
</html>
